# This is a basic workflow to help you get started with Actions

name: Release-CI

# Controls when the action will run. Triggers on pushing a tag
on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Update apt repository
        run: sudo apt-get update -y

      - name: Install build dependencies
        run: sudo apt-get install -y build-essential cmake qt6-base-dev qt6-tools-dev qt6-tools-dev-tools libglib2.0-dev libxtst-dev libx11-dev pkg-config debhelper-compat dpkg-dev

      - name: Build debian package
        id: build_debian_package
        run: |
            dpkg-buildpackage -us -uc -b
            filename=$(find .. -type f \( -iname \*.deb -o -iname \*.rpm \) -exec basename {} \;)
            echo "filepath=../$filename" >> "$GITHUB_OUTPUT"
            echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: actions/create-release@master
        env:
            GITHUB_TOKEN: ${{ secrets.PASTES_RELEASE }}
        with:
            tag_name: ${{ github.ref }}
            release_name: Release ${{ github.ref }}
            draft: false
            prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@master
        env:
           GITHUB_TOKEN: ${{ secrets.PASTES_RELEASE }}
        with:
           upload_url: ${{ steps.create_release.outputs.upload_url }}
           asset_path: ${{ steps.build_debian_package.outputs.filepath }}
           asset_name: ${{ steps.build_debian_package.outputs.filename }}
           asset_content_type: application/x-tgz
