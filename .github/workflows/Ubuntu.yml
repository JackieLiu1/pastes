name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout pastes source code
        uses: actions/checkout@v4
      - name: Update apt repository
        run: sudo apt-get update -y
      - name: Install build dependencies
        run: sudo apt-get install -y build-essential cmake qt6-base-dev qt6-tools-dev qt6-tools-dev-tools libqt6svg6 libqt6sql6-sqlite qt6-image-formats-plugins libglib2.0-dev libxtst-dev libx11-dev libxi-dev libxcb-res0-dev xvfb xauth pkg-config dpkg-dev patchelf
      - name: CMake configure & build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release;
          cmake --build build -j$(nproc);
      - name: Verify contracts and architecture
        run: ctest --test-dir build --output-on-failure
      - name: Build installation package
        run: |
          (
            umask 077
            cmake --build build --target package
          )
          dpkg-deb --info build/dist/*.deb
          dpkg-deb --contents build/dist/*.deb
          dpkg-deb --extract build/dist/*.deb build/package-test-root
          python3 tests/packaging/linux_package_test.py build/package-test-root
